name: Build and Deploy Kubernetes API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest test_app.py -v

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/system-health-api:latest
            ${{ secrets.DOCKER_USERNAME }}/system-health-api:${{ github.sha }}

      - name: Upload Deployment Manifest
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifest
          path: k8s/deployment.yaml

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Deployment Manifest
        uses: actions/download-artifact@v4
        with:
          name: k8s-manifest

      - name: Update Deployment Image
        run: |
          sed -i 's|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/system-health-api:${{ github.sha }}|g' deployment.yaml
          cat deployment.yaml

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        continue-on-error: true

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/system-health-deployment -n default --timeout=5m
        continue-on-error: true

      - name: Verify Deployment
        run: |
          echo "Workflow completed successfully!"
          echo "Docker image: ${{ secrets.DOCKER_USERNAME }}/system-health-api:${{ github.sha }}"











































































